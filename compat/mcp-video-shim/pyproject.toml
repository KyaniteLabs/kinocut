[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-video"
version = "1.6.21"
description = "Compatibility installer for Kinocut, formerly mcp-video."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["kinocut==2.0.0"]

[project.optional-dependencies]
client = ["kinocut[client]==2.0.0"]
image = ["kinocut[image]==2.0.0"]
image-ai = ["kinocut[image-ai]==2.0.0"]
audio = ["kinocut[audio]==2.0.0"]
audio-enhanced = ["kinocut[audio-enhanced]==2.0.0"]
audio-ai = ["kinocut[audio-ai]==2.0.0"]
audio-midi = ["kinocut[audio-midi]==2.0.0"]
audio-analysis = ["kinocut[audio-analysis]==2.0.0"]
hyperframes = ["kinocut[hyperframes]==2.0.0"]
transcribe = ["kinocut[transcribe]==2.0.0"]
ai-scene = ["kinocut[ai-scene]==2.0.0"]
stems = ["kinocut[stems]==2.0.0"]
object-matte = ["kinocut[object-matte]==2.0.0"]
upscale = ["kinocut[upscale]==2.0.0"]
ai = ["kinocut[ai]==2.0.0"]
all-ai = ["kinocut[all-ai]==2.0.0"]
audio-all = ["kinocut[audio-all]==2.0.0"]
dev = ["kinocut[dev]==2.0.0"]

[project.urls]
Homepage = "https://kinocut.dev/"
Repository = "https://github.com/KyaniteLabs/kinocut"

[tool.hatch.build.targets.wheel]
bypass-selection = true
