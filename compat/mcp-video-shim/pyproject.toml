[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-video"
version = "1.6.12"
description = "Compatibility installer for Kinocut, formerly mcp-video."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["kinocut==1.15.1"]

[project.scripts]
mcp-video = "kinocut.__main__:main"

[project.optional-dependencies]
client = ["kinocut[client]==1.15.1"]
image = ["kinocut[image]==1.15.1"]
image-ai = ["kinocut[image-ai]==1.15.1"]
audio = ["kinocut[audio]==1.15.1"]
audio-enhanced = ["kinocut[audio-enhanced]==1.15.1"]
audio-ai = ["kinocut[audio-ai]==1.15.1"]
audio-midi = ["kinocut[audio-midi]==1.15.1"]
audio-analysis = ["kinocut[audio-analysis]==1.15.1"]
hyperframes = ["kinocut[hyperframes]==1.15.1"]
transcribe = ["kinocut[transcribe]==1.15.1"]
ai-scene = ["kinocut[ai-scene]==1.15.1"]
stems = ["kinocut[stems]==1.15.1"]
object-matte = ["kinocut[object-matte]==1.15.1"]
upscale = ["kinocut[upscale]==1.15.1"]
ai = ["kinocut[ai]==1.15.1"]
all-ai = ["kinocut[all-ai]==1.15.1"]
audio-all = ["kinocut[audio-all]==1.15.1"]
dev = ["kinocut[dev]==1.15.1"]

[project.urls]
Homepage = "https://kinocut.dev/"
Repository = "https://github.com/KyaniteLabs/kinocut"

[tool.hatch.build.targets.wheel]
bypass-selection = true
