on:
  pull_request:
  push:
    branches: [master]
jobs:
  diagnostic:
    runs-on: heavy
    steps:
      - name: Basic environment check
        run: |
          set -ex
          {
            echo "=== START $(date) ==="
            echo "OS: $(cat /etc/os-release | head -1)"
            echo "Python: $(python3 --version 2>&1)"
            echo "User: $(whoami)"
            echo "PWD: $(pwd)"
            echo "CI=${CI:-unset}"
            echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-unset}"
            echo "=== END ==="
          } | tee /workspace/.ci-diagnostic-output.txt
          echo "DIAGNOSTIC COMPLETE"
