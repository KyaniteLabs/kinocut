on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    container:
      image: git.kyanitelabs.tech/kyanitelabs/ci-images-base:v1
    # Lightweight: ruff only. Routed to `light` so lint never queues behind
    # heavy test jobs on the capacity-2 runner.
    # Uses manual git clone instead of actions/checkout@v4 because the CI
    # runner (Colima VM) cannot reach gitea.com to download the action.
    runs-on: light
    timeout-minutes: 15
    # Conservative docs/meta path filter consumed by test-ffmpeg-matrix and
    # test-slow (see the derivation comment on the "Compute CI scope" step).
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
    steps:
      - name: Checkout
        shell: bash
        timeout-minutes: 10
        env:
          JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_TOKEN_FALLBACK: ${{ github.token }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.head_ref }}
          PR: ${{ github.event.number }}
        run: |
          set -eu
          export GIT_TERMINAL_PROMPT=0
          TOKEN="${JOB_TOKEN:-${JOB_TOKEN_FALLBACK:-}}"
          if [ -z "$TOKEN" ]; then
            echo "clone token empty; secrets.GITHUB_TOKEN and github.token are unset"
            echo "runner images cannot clone Forgejo anonymously"
            exit 1
          fi
          post_checkout_status() {
            state="$1"
            desc="$2"
            desc=$(printf '%s' "$desc" | cut -c1-140)
            payload=$(printf '{"state":"%s","context":"lint-checkout","description":"%s"}' "$state" "$desc")
            curl --fail --silent --show-error --max-time 20 \
              -X POST \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/json" \
              -H "User-Agent: kinocut-ci" \
              --data "$payload" \
              "https://git.kyanitelabs.tech/api/v1/repos/${STATUS_REPO}/statuses/${STATUS_SHA}"
          }
          trap 'post_checkout_status error "checkout failed token_len=${#TOKEN}"' EXIT
          post_checkout_status pending "curl-ok token_len=${#TOKEN}"
          WORKDIR="${GITHUB_WORKSPACE:-$(pwd)}/src"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          git clone --depth 1 "https://x-access-token:${TOKEN}@git.kyanitelabs.tech/${REPO}.git" .
          if ! git fetch --depth 50 origin "$SHA"; then
            if [ -n "${REF:-}" ]; then git fetch --depth 50 origin "$REF" || true; fi
            if [ -n "${PR:-}" ]; then git fetch origin "refs/pull/${PR}/head:refs/heads/pr-head" || true; fi
          fi
          git checkout "$SHA" || git checkout FETCH_HEAD
          git log -1 --oneline
          git rev-parse HEAD
          trap - EXIT
          post_checkout_status success "ok token_len=${#TOKEN}"

      - name: Compute CI scope
        id: scope
        working-directory: src
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eu
          # Conservative path filter (derivation + safety argument in
          # scripts/ci_scope.py; measured basis: KINOCUT-CI-OPTIMIZATION-PLAN.md,
          # org-hq 2026-09-14). The ffmpeg-matrix test files transitively import
          # 394 of the repo's 854 python modules, so module-level filtering is
          # useless; the provable line is code vs docs/meta. None of the matrix
          # test files, their conftest chain, or any slow-marked test reads
          # docs/**, **/*.md, LICENSE*, .gitignore/.editorconfig/.gitattributes,
          # robots.txt, sitemap.xml or og-social-preview.png, and every
          # docs-bound test lives in the not-slow shards that always run — so
          # skipping matrix+slow on a docs/meta-only diff cannot mask a failure.
          # Any code path (including this workflow) keeps the full pipeline,
          # and every failure mode below fails OPEN (runs everything).
          code_changed=true
          base=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            if git fetch --depth 50 origin "$BASE_REF" 2>/dev/null; then
              base="$(git merge-base HEAD FETCH_HEAD 2>/dev/null || echo FETCH_HEAD)"
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -n "$base" ] && git diff --name-only "$base" HEAD | python3 scripts/ci_scope.py > ci-scope.txt; then
            code_changed="$(cat ci-scope.txt)"
          fi
          echo "CI scope: code_changed=$code_changed"
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

      - name: Install ruff
        working-directory: src
        run: |
          python3 -m venv .venv-lint
          .venv-lint/bin/pip install --timeout 60 --retries 3 --quiet "ruff==0.16.3"
      - name: Lint
        working-directory: src
        env:
          STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_TOKEN_FALLBACK: ${{ github.token }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          if .venv-lint/bin/ruff check . > ruff-out.txt 2>&1; then
            cat ruff-out.txt
            exit 0
          fi
          cat ruff-out.txt
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          desc = open("ruff-out.txt", encoding="utf-8", errors="replace").read().replace("\n", " | ")[-130:]
          token = os.environ.get("STATUS_TOKEN") or os.environ.get("STATUS_TOKEN_FALLBACK") or ""
          sha = os.environ["STATUS_SHA"]
          repo = os.environ["STATUS_REPO"]
          payload = json.dumps({
              "state": "failure",
              "context": "lint-ruff-tail",
              "description": desc or "ruff failed with empty output",
          }).encode()
          req = urllib.request.Request(
              f"https://git.kyanitelabs.tech/api/v1/repos/{repo}/statuses/{sha}",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"token {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "kinocut-ci",
              },
          )
          try:
              urllib.request.urlopen(req, timeout=20).read()
          except Exception as exc:
              print("status post failed", exc)
          raise SystemExit(1)
          PY
  test:
    container:
      # Deterministic noble test env on every runner (matches the historically
      # green G2 lane). The suite's not-slow shards still fail on bookworm-based
      # fresh venvs (pre-existing, py3.11/pip-resolution sensitive), so the test
      # job keeps the apt toolchain instead of the baked bookworm base image.
      image: ubuntu:24.04
    needs: lint
    # PR-safe test matrix: Node 18 + FFmpeg + the full dependency tree + the "not slow" suite.
    # Four serial shards stay below the instance's per-job timeout without xdist subprocess contention.
    # Two x86-heavy runners on G2 (colima-ci-runner + g2-runner-2) allow 2-way
    # shard parallelism. The old serial constraint (max-parallel: 1) existed because
    # a single capacity-constrained runner starved the light lint job; with
    # prebuilt images and dual runners, that contention is gone.
    runs-on: x86-heavy
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq git python3 python3-pip python3-venv ffmpeg nodejs=18.19.1+dfsg-6ubuntu5
          set -eux
          export GIT_TERMINAL_PROMPT=0
          TOKEN='${{ secrets.GITHUB_TOKEN }}'
          REPO='${{ github.repository }}'
          SHA='${{ github.sha }}'
          REF='${{ github.head_ref }}'
          PR='${{ github.event.number }}'
          if [ -z "$TOKEN" ]; then
            echo "GITHUB_TOKEN is empty; runner images cannot clone Forgejo anonymously"
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@git.kyanitelabs.tech/${REPO}.git" .
          if ! git fetch --depth 50 origin "$SHA"; then
            if [ -n "$REF" ]; then git fetch --depth 50 origin "$REF" || true; fi
            if [ -n "$PR" ]; then git fetch origin "refs/pull/${PR}/head:refs/heads/pr-head" || true; fi
          fi
          git checkout "$SHA" || git checkout FETCH_HEAD
          git log -1 --oneline
          git rev-parse HEAD
      - name: Install package
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -e ".[dev]"
      - name: Test shard
        env:
          SHARD_COUNT: "4"
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import pytest

          count = int(os.environ["SHARD_COUNT"])
          index = int(os.environ["SHARD_INDEX"])
          tests = sorted(Path("tests").rglob("test_*.py"))
          selected = tests[index::count]
          if not selected:
              raise SystemExit(f"test shard {index} is empty")
          print(f"Running shard {index + 1}/{count}: {len(selected)} files")
          raise SystemExit(pytest.main([*(str(path) for path in selected), "-q", "-m", "not slow"]))
          PY
  test-slow:
    container:
      # Same noble posture as `test` (see rationale there); the slow suite has
      # the same bookworm latent failures.
      image: ubuntu:24.04
    needs: test-ffmpeg-matrix
    # Slow real-media integration suite, skipped by the PR `test` job. Runs only
    # on push to master — and only when the matrix actually ran: a skipped
    # matrix means a docs/meta-only diff, and no slow-marked test reads
    # docs/** or *.md, so the slow suite's inputs are unchanged. Kept serial
    # (no -n) because these tests do heavier real I/O.
    if: ${{ github.event_name == 'push' && needs.test-ffmpeg-matrix.result == 'success' }}
    runs-on: x86-heavy
    steps:
      - name: Checkout
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq git python3 python3-pip python3-venv ffmpeg
          set -eux
          export GIT_TERMINAL_PROMPT=0
          TOKEN='${{ secrets.GITHUB_TOKEN }}'
          REPO='${{ github.repository }}'
          SHA='${{ github.sha }}'
          REF='${{ github.head_ref }}'
          PR='${{ github.event.number }}'
          if [ -z "$TOKEN" ]; then
            echo "GITHUB_TOKEN is empty; runner images cannot clone Forgejo anonymously"
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@git.kyanitelabs.tech/${REPO}.git" .
          if ! git fetch --depth 50 origin "$SHA"; then
            if [ -n "$REF" ]; then git fetch --depth 50 origin "$REF" || true; fi
            if [ -n "$PR" ]; then git fetch origin "refs/pull/${PR}/head:refs/heads/pr-head" || true; fi
          fi
          git checkout "$SHA" || git checkout FETCH_HEAD
          git log -1 --oneline
          git rev-parse HEAD
      - name: Install package
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -e ".[dev]"
      - name: Slow tests
        run: .venv/bin/pytest tests/ -q -m "slow"
  test-ffmpeg-matrix:
    container:
      image: git.kyanitelabs.tech/kyanitelabs/ci-images-ffmpeg-${{ matrix.major }}:v1
    needs: [test, lint]
    # Cross-FFmpeg-version filtergraph portability matrix.
    #
    # Path filter: skipped only when lint's "Compute CI scope" step classified
    # the diff as docs/meta-only (derivation in scripts/ci_scope.py). The
    # needs.test.result guard keeps the matrix off broken trees exactly like
    # the pre-filter dependency behavior did. Workflow changes and every code
    # path always run the full matrix.
    if: ${{ needs.test.result == 'success' && needs.lint.outputs.code_changed == 'true' }}
    #
    # WHY: the apt-based `test` job exercises exactly ONE ffmpeg — the runner
    # OS's build (currently 6.1.1). A filtergraph that parses on dev-local
    # ffmpeg 8 but not on 6 slips straight through. This bit us on 2026-07-09:
    # the composite masked-render path used `scale2ref=w=rw:h=rh`; the rw/rh
    # named vars were only added in ffmpeg 7, so it broke on the ffmpeg-6 CI
    # runner and was caught by luck, not design. This job downloads pinned
    # static ffmpeg 6/7/8 builds and runs the render/filtergraph tests against
    # each, so version-specific parse bugs fail loudly, every time.
    #
    # Additive coverage — the apt `test` job stays as-is. Routed to `x86-heavy`
    # because real renders are CPU-heavy and the assets are architecture-specific.
    # Static builds are pinned to immutable BtbN release tags (repo policy: pin exact versions).
    # Assets use the `linux64` variant because the dedicated G2 runner is x86_64.
    # The per-leg version assert fails the job if an asset ever drifts off its expected major.
    runs-on: x86-heavy
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - major: "6"
            ffmpeg_tag: autobuild-2025-08-31-13-00
            ffmpeg_asset: ffmpeg-n6.1.3-linux64-gpl-6.1.tar.xz
          - major: "7"
            # 7.1.0 (autobuild-2024-09-30) has an upstream `best_input >= 0`
            # assertion regression (ffmpeg_filter.c) that aborts on the glitch
            # engine's scale2ref+displace graphs; fixed by 7.1.5. Pin the fixed
            # month-end build, which BtbN retains for two years; daily builds
            # expire after 14 days.
            ffmpeg_tag: autobuild-2026-06-30-13-34
            ffmpeg_asset: ffmpeg-n7.1.5-1-g7d0e842004-linux64-gpl-7.1.tar.xz
          - major: "8"
            ffmpeg_tag: autobuild-2026-06-30-13-34
            ffmpeg_asset: ffmpeg-n8.1.2-21-gce3c09c101-linux64-gpl-8.1.tar.xz
    steps:
      - name: Checkout
        run: |
          set -eux
          export GIT_TERMINAL_PROMPT=0
          TOKEN='${{ secrets.GITHUB_TOKEN }}'
          REPO='${{ github.repository }}'
          SHA='${{ github.sha }}'
          REF='${{ github.head_ref }}'
          PR='${{ github.event.number }}'
          if [ -z "$TOKEN" ]; then
            echo "GITHUB_TOKEN is empty; runner images cannot clone Forgejo anonymously"
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@git.kyanitelabs.tech/${REPO}.git" .
          if ! git fetch --depth 50 origin "$SHA"; then
            if [ -n "$REF" ]; then git fetch --depth 50 origin "$REF" || true; fi
            if [ -n "$PR" ]; then git fetch origin "refs/pull/${PR}/head:refs/heads/pr-head" || true; fi
          fi
          git checkout "$SHA" || git checkout FETCH_HEAD
          git log -1 --oneline
          git rev-parse HEAD
      - name: Assert FFmpeg major is ${{ matrix.major }}
        run: |
          set -euo pipefail
          ver="$(ffmpeg -version | head -1)"
          echo "$ver"
          ffprobe -version | head -1
          case "$ver" in
            *"version n${{ matrix.major }}."*|*"version ${{ matrix.major }}."*)
              echo "FFmpeg major ${{ matrix.major }} confirmed." ;;
            *)
              echo "ERROR: expected FFmpeg major ${{ matrix.major }}, got: $ver" >&2
              exit 1 ;;
          esac
      - name: Install package
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -e ".[dev]"
      - name: Run compositor, workflow, and rescue portability tests
        # The matrix guards the ACTIVELY-DEVELOPED compositor + workflow
        # filtergraph surface — where the scale2ref=w=rw:h=rh FFmpeg-6 parse bug
        # lived — across pinned FFmpeg 6/7/8. These files are proven portable on
        # all three majors. The legacy filtergraph engines (glitch, transitions,
        # effects, advanced, real-media, filters) carry pre-existing quirks tied
        # to the FFmpeg BUILD, not our code (e.g. FFmpeg 7.1.0's best_input abort,
        # static-6.1.3 build-flag gaps) — they are covered by the `test` /
        # `test-slow` jobs on the runner's apt FFmpeg (the version that platform
        # actually ships). Runs slow AND not-slow: the masked-render regression is
        # gated on ffmpeg presence, not the `slow` marker. The rescue slice
        # exercises the public plan -> render -> inspect path, MOV/WebM sharing
        # copies, and reproducible render contracts on every supported major.
        run: |
          .venv/bin/pytest -q --tb=short \
            tests/test_engine_composite_layers.py \
            tests/test_server_tools_composite_layers.py \
            tests/test_workflow_golden.py \
            tests/test_engine_overlay.py \
            tests/test_rescue_e2e.py::test_fix_this_clip_end_to_end \
            tests/test_rescue_e2e.py::test_container_inputs_produce_verified_universal_package \
            tests/test_rescue_e2e.py::test_plan_and_render_semantics_are_reproducible
  secret-scan:
    container:
      image: git.kyanitelabs.tech/kyanitelabs/ci-images-base:v1
    # Head-of-Security card F5 (AUDIT-2026-09-15): the repo had zero secret-scan
    # gates. Deterministic vendored scanner (scripts/secret_scan.py): stdlib
    # only, no new runner dependencies, no network. Always-on by design —
    # secrets can land in any path (docs included), so this job takes no path
    # filter, and nothing needs it (fail-closed, never blocks other lanes).
    # Posts a `secret-scan` commit status because workflow_dispatch runs do
    # not get automatic statuses on this Forgejo (15.0.3, no actions-log API).
    runs-on: light
    timeout-minutes: 10
    steps:
      - name: Checkout
        shell: bash
        timeout-minutes: 10
        env:
          JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_TOKEN_FALLBACK: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.head_ref }}
          PR: ${{ github.event.number }}
        run: |
          set -eu
          export GIT_TERMINAL_PROMPT=0
          TOKEN="${JOB_TOKEN:-${JOB_TOKEN_FALLBACK:-}}"
          if [ -z "$TOKEN" ]; then
            echo "clone token empty; secrets.GITHUB_TOKEN and github.token are unset"
            exit 1
          fi
          WORKDIR="${GITHUB_WORKSPACE:-$(pwd)}/src"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          git clone --depth 1 "https://x-access-token:${TOKEN}@git.kyanitelabs.tech/${REPO}.git" .
          if ! git fetch --depth 50 origin "$SHA"; then
            if [ -n "${REF:-}" ]; then git fetch --depth 50 origin "$REF" || true; fi
            if [ -n "${PR:-}" ]; then git fetch origin "refs/pull/${PR}/head:refs/heads/pr-head" || true; fi
          fi
          git checkout "$SHA" || git checkout FETCH_HEAD
          git log -1 --oneline
      - name: Secret scan
        working-directory: src
        shell: bash
        env:
          STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_TOKEN_FALLBACK: ${{ github.token }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          post_status() {
            state="$1"; desc="$2"
            desc=$(printf '%s' "$desc" | tr '\n' '|' | cut -c1-140)
            payload=$(printf '{"state":"%s","context":"secret-scan","description":"%s"}' "$state" "$desc")
            curl --fail --silent --show-error --max-time 20 \
              -X POST \
              -H "Authorization: token ${STATUS_TOKEN:-${STATUS_TOKEN_FALLBACK}}" \
              -H "Content-Type: application/json" \
              -H "User-Agent: kinocut-ci" \
              --data "$payload" \
              "https://git.kyanitelabs.tech/api/v1/repos/${STATUS_REPO}/statuses/${STATUS_SHA}" \
              || echo "status post failed (non-fatal)"
          }
          if python3 scripts/secret_scan.py 2>&1 | tee secret-scan-out.txt; then
            post_status success "$(tail -1 secret-scan-out.txt)"
          else
            post_status failure "$(grep -m1 '^FINDING\|^ALLOWLIST ERROR' secret-scan-out.txt || tail -1 secret-scan-out.txt)"
            exit 1
          fi
  dep-audit:
    container:
      image: git.kyanitelabs.tech/kyanitelabs/ci-images-base:v1
    # Head-of-Security card F5: zero dependency-audit gates. Audits the SHIPPED
    # runtime surface exactly as the pipeline installs it (pip install -e . ->
    # pip freeze -> pip-audit over the pinned set; --no-deps keeps the audit on
    # exactly what the freeze shows). The npm package is a thin uvx launcher
    # with zero runtime deps and no lockfile today: that step honestly no-ops
    # until a lockfile lands. Review-approved exceptions: scripts/pip_audit_allowlist.txt.
    # Posts a `dep-audit` commit status (see secret-scan note).
    runs-on: light
    timeout-minutes: 15
    steps:
      - name: Checkout
        shell: bash
        timeout-minutes: 10
        env:
          JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_TOKEN_FALLBACK: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.head_ref }}
          PR: ${{ github.event.number }}
        run: |
          set -eu
          export GIT_TERMINAL_PROMPT=0
          TOKEN="${JOB_TOKEN:-${JOB_TOKEN_FALLBACK:-}}"
          if [ -z "$TOKEN" ]; then
            echo "clone token empty; secrets.GITHUB_TOKEN and github.token are unset"
            exit 1
          fi
          WORKDIR="${GITHUB_WORKSPACE:-$(pwd)}/src"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          git clone --depth 1 "https://x-access-token:${TOKEN}@git.kyanitelabs.tech/${REPO}.git" .
          if ! git fetch --depth 50 origin "$SHA"; then
            if [ -n "${REF:-}" ]; then git fetch --depth 50 origin "$REF" || true; fi
            if [ -n "${PR:-}" ]; then git fetch origin "refs/pull/${PR}/head:refs/heads/pr-head" || true; fi
          fi
          git checkout "$SHA" || git checkout FETCH_HEAD
          git log -1 --oneline
      - name: Python dependency audit
        working-directory: src
        shell: bash
        env:
          STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_TOKEN_FALLBACK: ${{ github.token }}
          STATUS_SHA: ${{ github.sha }}
          STATUS_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          post_status() {
            state="$1"; desc="$2"
            desc=$(printf '%s' "$desc" | tr '\n' '|' | cut -c1-140)
            payload=$(printf '{"state":"%s","context":"dep-audit","description":"%s"}' "$state" "$desc")
            curl --fail --silent --show-error --max-time 20 \
              -X POST \
              -H "Authorization: token ${STATUS_TOKEN:-${STATUS_TOKEN_FALLBACK}}" \
              -H "Content-Type: application/json" \
              -H "User-Agent: kinocut-ci" \
              --data "$payload" \
              "https://git.kyanitelabs.tech/api/v1/repos/${STATUS_REPO}/statuses/${STATUS_SHA}" \
              || echo "status post failed (non-fatal)"
          }
          python3 -m venv .venv-audit
          .venv-audit/bin/pip install --quiet --timeout 60 --retries 3 --upgrade pip
          .venv-audit/bin/pip install --quiet --timeout 60 --retries 3 -e .
          .venv-audit/bin/pip freeze --exclude-editable > audit-frozen.txt
          .venv-audit/bin/pip install --quiet --timeout 60 --retries 3 pip-audit
          mapfile -t ignore_flags < <(grep -vE '^[[:space:]]*(#|$)' scripts/pip_audit_allowlist.txt | awk '{print "--ignore-vuln", $1}')
          if .venv-audit/bin/pip-audit --no-deps -r audit-frozen.txt "${ignore_flags[@]}" 2>&1 | tee pip-audit-out.txt; then
            post_status success "$(grep -m1 'No known vulnerabilities' pip-audit-out.txt || tail -1 pip-audit-out.txt)"
          else
            post_status failure "$(grep -m1 -E 'GHSA-|PYSEC-' pip-audit-out.txt || tail -1 pip-audit-out.txt)"
            exit 1
          fi
      - name: npm dependency audit
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f npm/package-lock.json ]; then
            echo "npm surface: no package-lock.json (thin uvx launcher, zero runtime deps) — nothing to audit yet"
            exit 0
          fi
          cd npm
          npm audit --package-lock-only --audit-level=high
