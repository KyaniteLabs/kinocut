name: kinocut-video-ci
description: Render + quality gate + receipt for Kinocut Video CI (TE.12)
inputs:
  project_dir:
    description: Path to Kinocut project / cutfile directory
    required: true
  media:
    description: Input media path for review_run / metric-qc
    required: true
  cutfile:
    description: Optional cutfile path (relative to project_dir) to render before gate
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Kinocut
      shell: bash
      run: |
        python -m pip install -U pip
        python -m pip install "kinocut>=1.13.3"
    - name: Optional cutfile render
      shell: bash
      if: ${{ inputs.cutfile != '' }}
      run: |
        kino cutfile-render "${{ inputs.project_dir }}/${{ inputs.cutfile }}" --format json \
          | tee cutfile_render.json
        mkdir -p "${{ inputs.project_dir }}/receipts"
        cp cutfile_render.json "${{ inputs.project_dir }}/receipts/video-ci-cutfile-render.json"
    - name: Metric floor gate
      shell: bash
      run: |
        kino metric-qc "${{ inputs.media }}" --format json | tee metric_qc.json
        mkdir -p "${{ inputs.project_dir }}/receipts"
        cp metric_qc.json "${{ inputs.project_dir }}/receipts/video-ci-metric-qc.json"
    - name: Review run gate
      shell: bash
      run: |
        kino review-run "${{ inputs.media }}" --format json | tee review_run.json
    - name: Write receipt
      shell: bash
      run: |
        mkdir -p "${{ inputs.project_dir }}/receipts"
        cp review_run.json "${{ inputs.project_dir }}/receipts/video-ci-review.json"
        python - <<'PY'
        import json, time
        from pathlib import Path
        root = Path("${{ inputs.project_dir }}") / "receipts"
        receipt = {
            "artifact_kind": "kinocut_video_ci_receipt",
            "media": "${{ inputs.media }}",
            "cutfile": "${{ inputs.cutfile }}" or None,
            "created_at": time.time(),
            "artifacts": sorted(p.name for p in root.glob("video-ci-*.json")),
        }
        (root / "video-ci.receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
        print("Kinocut Video CI receipt written", root / "video-ci.receipt.json")
        PY
