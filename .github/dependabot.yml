# Dependency updates for the GitHub collaboration mirror.
# Forgejo Renovate (#3) still needs GITHUB_COM_TOKEN / hostRules for GitHub digests.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
