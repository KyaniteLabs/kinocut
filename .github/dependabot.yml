# Dependency updates for Kinocut's primary GitHub repository.
# Forgejo will receive accepted updates once the downstream sync is activated and verified.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
