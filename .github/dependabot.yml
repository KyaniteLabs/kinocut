# Dependency updates for Kinocut's primary GitHub repository.
# Forgejo will receive accepted updates once the downstream sync is activated and verified.
# Minor and patch bumps arrive as one grouped PR per ecosystem per week, so each
# week costs one full CI run per ecosystem instead of one per package.
# Major bumps stay separate.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
