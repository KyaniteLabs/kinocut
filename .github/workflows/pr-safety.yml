name: PR safety

on:
  pull_request:
    branches: [master]

jobs:
  hosted-pr-checks:
    name: Hosted PR checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Classify changes
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(kinocut/|kinocut_sound/|mcp_video\.py|tests/|pyproject\.toml|uv\.lock|\.github/workflows/pr-safety\.yml|scripts/annotate-pytest-failures\.py)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip hosted checks
        if: steps.classify.outputs.code != 'true'
        run: echo "Code inputs unchanged; marking hosted PR checks successful."
      - name: Ensure FFmpeg
        timeout-minutes: 10
        if: steps.classify.outputs.code == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.classify.outputs.code == 'true'
        with:
          python-version: "3.14"
      - name: Install package
        if: steps.classify.outputs.code == 'true'
        # ruff pinned to the same version as the CI lint job so the hosted PR
        # lane and master lint agree; bump together with pyproject floor.
        run: python -m pip install -e ".[dev]" "ruff==0.15.11"
      - name: Lint
        if: steps.classify.outputs.code == 'true'
        run: |
          ruff check kinocut/ kinocut_sound/ mcp_video.py tests/ scripts/annotate-pytest-failures.py
          ruff format --check kinocut/ kinocut_sound/ mcp_video.py tests/ scripts/annotate-pytest-failures.py
      - name: Test
        id: pytest
        if: steps.classify.outputs.code == 'true'
        run: pytest tests/ -q -m "not slow" --tb=short --junitxml="$RUNNER_TEMP/kinocut-pytest.xml"
      - name: Annotate failing tests
        if: failure() && steps.classify.outputs.code == 'true' && steps.pytest.outcome == 'failure'
        run: python scripts/annotate-pytest-failures.py "$RUNNER_TEMP/kinocut-pytest.xml"
