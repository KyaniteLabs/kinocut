name: Plugin validate

# Not a required check: workflow-level paths filters are safe here. It runs only
# when the Hermes plugin or this workflow changes.
on:
  push:
    branches: [ master ]
    paths:
      - 'plugins/**'
      - '.github/workflows/plugin-validate.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'plugins/**'
      - '.github/workflows/plugin-validate.yml'

permissions:
  contents: read

concurrency:
  group: plugin-validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-plugin:
    name: Hermes Desktop plugin tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '24'

    - name: Test Hermes Desktop plugin
      run: node --test plugins/kinocut/desktop/plugin.test.mjs

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
        path: repo

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.14'

    - name: Checkout the tested Hermes runtime
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: NousResearch/hermes-agent
        ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19  # v0.23.0
        path: .hermes-runtime
        persist-credentials: false

    - name: Install Hermes from its own lockfile
      run: |
        python -m pip install uv==0.11.13
        uv sync --frozen --python 3.14 --directory .hermes-runtime

    - name: Real plugin validator (no credentials)
      run: |
        mkdir -p receipts
        HERMES_HOME="$RUNNER_TEMP/hermes-home" .hermes-runtime/.venv/bin/hermes plugins validate repo/plugins/kinocut --json > receipts/validate.json
        cat receipts/validate.json
        python3 -c "import json,sys; d=json.load(open('receipts/validate.json')); sys.exit(0 if d.get('ok') is True else 'validator did not report ok: true')"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: plugin-validation
        path: receipts/
