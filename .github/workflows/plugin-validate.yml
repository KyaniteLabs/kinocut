name: Plugin validate

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
        path: repo

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.14'

    - name: Checkout the tested Hermes runtime
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: NousResearch/hermes-agent
        ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19  # v0.23.0
        path: .hermes-runtime
        persist-credentials: false

    - name: Install Hermes from its own lockfile
      run: |
        python -m pip install uv==0.11.13
        uv sync --frozen --python 3.14 --directory .hermes-runtime

    - name: Real plugin validator (no credentials)
      run: |
        mkdir -p receipts
        HERMES_HOME="$RUNNER_TEMP/hermes-home" .hermes-runtime/.venv/bin/hermes plugins validate repo/plugins/kinocut --json > receipts/validate.json
        cat receipts/validate.json

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: plugin-validation
        path: receipts/
