name: Published claims live

# Merge-time live published-claims probe: published_version in
# docs/public_claims.json must match live PyPI. Moved here from Forgejo CI
# when GitHub became KinoCut's only CI (fleet GIT-CI-STRATEGY-20261123).
on:
  push:
    branches: [master]
    paths:
      - "docs/public_claims.json"
      - "README.md"
      - "llms.txt"
      - "CHANGELOG.md"
      - "docs/faq.md"
      - "docs/CLI_REFERENCE.md"
      - "docs/HUMAN_GATES.md"
      - "docs/status/NOW.md"
      - "scripts/apply_public_release_cutover.py"
      - "scripts/verify_published_claims_live.py"
      - ".github/workflows/claims-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-matches-claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify published_version against live PyPI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_published_claims_live.py
