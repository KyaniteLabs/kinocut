name: Catalog pins

on:
  schedule:
    - cron: "17 9 * * 1"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-pins:
    name: Plugin catalogs launch the latest Kinocut
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare catalog pins with PyPI
        run: python3 scripts/check_catalog_pins.py
