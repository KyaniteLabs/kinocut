name: Sync Forgejo downstream

# GitHub is KinoCut's trunk; the Forgejo copy (KyaniteLabs/kinocut) is a
# read-only mirror that runs no CI (fleet GIT-CI-STRATEGY-20261123). After
# trunk CI passes on master, the shared workflow in KyaniteLabs/.github
# fast-forwards the mirror to that exact commit: never on pull_request, never
# --force, only from the master-restricted forgejo-mirror environment.
# Staged activation guard: unset/false KINOCUT_FORGEJO_SYNC_ACTIVE skips it.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Only master CI can be synced; pull-request CI completions used to start a
    # run here that always skipped.
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: sync-forgejo-master
  cancel-in-progress: false

jobs:
  sync:
    if: vars.KINOCUT_FORGEJO_SYNC_ACTIVE == 'true' && github.event.workflow_run.conclusion == 'success'
    uses: KyaniteLabs/.github/.github/workflows/sync-forgejo.yml@a9070204d393afce800230b4eefc809569b45a4a # main 2026-11-23
    with:
      trunk: master
      trigger-workflow-id: 249485876
      trigger-workflow-name: CI
      trigger-workflow-path: .github/workflows/ci.yml
      required-workflows: |
        249485876:.github/workflows/ci.yml
        310965482:.github/workflows/mirror-smoke.yml
        262986319:.github/workflows/integration-smoke.yml
      forgejo-repository: KyaniteLabs/kinocut
      downstream-workflow: none
      dry-run: true
      toolkit-ref: a9070204d393afce800230b4eefc809569b45a4a
    secrets: inherit
