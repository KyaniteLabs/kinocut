[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinocut"
version = "2.2.0"
description = "Trusted, guardrailed video editing for AI agents. FFmpeg, Hyperframes, repurposing tools, Python client, CLI, and MCP server."
readme = "README-PYPI.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = [
    "video", "editing", "mcp", "ffmpeg", "hyperframes", "ai", "agents",
    "claude", "claude-code", "cursor", "codex", "subtitle", "subtitles", "whisper", "transcription",
    "video-processing", "chroma-key", "stabilization", "color-grading",
    "model-context-protocol", "mcp-server", "ai-video", "video-automation", "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
    "Typing :: Typed",
]
dependencies = [
    # mcp 2.0 removed mcp.server.fastmcp; Kinocut still uses FastMCP Context/app.
    "mcp>=1.28.1,<2",
    # Security floors also apply to constrained pip consumers, not only uv.lock.
    "anyio>=4.14.2",
    "click>=8.3.3",
    "cryptography>=50.0.0",
    "PyJWT>=2.15.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "pydantic>=2.13.2",
    "rich>=15.0.0",
]

[project.optional-dependencies]
# Security floors cover optional transitive packages without adding them to core.
# BasicSR has an unpatched, unused SLURM path; see the release-candidate record.
client = ["pillow>=13.0.0"]
image = ["pillow>=13.0.0", "numpy>=1.26", "scikit-learn>=1.3", "webcolors>=1.13"]
image-ai = ["pillow>=13.0.0", "numpy>=1.26", "scikit-learn>=1.3", "webcolors>=1.13", "anthropic>=0.96.0"]
audio = ["numpy>=1.24"]
audio-enhanced = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12"]
# audio-ai and audio-midi are capability aliases of `audio` kept for install
# compatibility. The BasicPitch bridge was removed; meltysynth is a manual
# integration. See docs/adr/0006 for the BasicPitch dependency decision.
audio-ai = ["numpy>=1.24"]
audio-midi = ["numpy>=1.24"]
# audio-analysis kept as an install alias; its librosa bridge was removed in 2.0.
audio-analysis = ["numpy>=1.24"]
hyperframes = []  # External: Node.js + resolvable Hyperframes CLI
transcribe = ["openai-whisper>=20231117", "torch>=2.13.0", "setuptools>=84.1.0", "urllib3>=2.8.0"]
lfm3-audio = ["transformers>=5.20.2", "torch>=2.13.0", "accelerate", "librosa", "soundfile", "safetensors"]
ai-scene = ["imagehash>=4.3", "Pillow>=12.3.0"]
stems = ["demucs>=4.0", "torch>=2.13.0", "torchaudio>=2.0", "torchcodec>=0.8", "setuptools>=84.1.0"]
object-matte = ["onnxruntime>=1.17", "numpy>=1.26", "pillow>=13.0.0"]
# The OpenCV backend is supported on its own. BasicSR 1.4.2 expects the
# torchvision.transforms.functional_tensor module removed by modern TorchVision.
upscale = [
    "numpy>=2.0.0",
    "opencv-contrib-python>=4.10",
]
ai = [
    "openai-whisper>=20231117",
    "demucs>=4.0",
    "numpy>=2.0.0",
    "opencv-contrib-python>=4.10",
    "torch>=2.13.0",
    "torchaudio>=2.0",
    "torchcodec>=0.8",
    "imagehash>=4.3",
    "Pillow>=12.3.0",
    "urllib3>=2.8.0",
    "setuptools>=84.1.0",
]
all-ai = [
    "openai-whisper>=20231117",
    "demucs>=4.0",
    "numpy>=2.0.0",
    "opencv-contrib-python>=4.10",
    "torch>=2.13.0",
    "torchaudio>=2.0",
    "torchcodec>=0.8",
    "imagehash>=4.3",
    "Pillow>=12.3.0",
    "scipy>=1.10",
    "soundfile>=0.12",
    "urllib3>=2.8.0",
    "setuptools>=84.1.0",
]
audio-all = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "pillow>=13.0.0",
    "numpy>=1.26",
    "PyYAML>=6.0.2",
    "rich>=15.0.0",
    "scikit-learn>=1.3",
    "webcolors>=1.13",
    "ruff>=0.15.11",
    # Pinned to the version ci.yml's type gate runs, so `pip install -e ".[dev]"`
    # reproduces that gate locally.
    "pyright==1.1.414",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
# These modules intentionally stay compact to satisfy enforced facade/function
# size limits; format them only alongside an architecture-preserving refactor.
exclude = ["kinocut/server.py", "kinocut/engine_audio_bed.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "S", "UP", "B", "SIM", "RUF"]
# S603/S607 (subprocess) and S310 (URL open) are suppressed per-line at the
# audited call sites instead of globally, so new unaudited sites get flagged.
ignore = ["E501", "S311"]

[tool.ruff.lint.per-file-ignores]
# Tests spawn developer-controlled ffmpeg/node fixtures; per-line subprocess
# audits add no security value there.
"tests/**/*.py" = ["S101", "S108", "S603", "S607"]
"manual/**/*.py" = ["S101", "S603", "S607"]
"demo/**/*.py" = ["S101", "S603", "S607"]
# Repo automation runs hardcoded commands/URLs; not a user-input surface.
"scripts/**/*.py" = ["S603", "S607", "S310"]
"workflows/**/*.py" = ["S603", "S607"]
".github/scripts/*.py" = ["S603", "S607"]

[project.scripts]
kino = "kinocut.__main__:main"
kinocut = "kinocut.__main__:main"
mcp-video = "kinocut.__main__:main"

[project.urls]
Homepage = "https://kinocut.dev/"
Documentation = "https://github.com/KyaniteLabs/kinocut#readme"
Repository = "https://github.com/KyaniteLabs/kinocut"
"Bug Tracker" = "https://github.com/KyaniteLabs/kinocut/issues"
Changelog = "https://github.com/KyaniteLabs/kinocut/blob/master/CHANGELOG.md"
Discussions = "https://github.com/KyaniteLabs/kinocut/discussions"

[tool.hatch.build]
exclude = [
    ".git/",
    ".gitignore",
    ".coverage",
    ".pytest_cache/",
    ".ruff_cache/",
    ".venv/",
    ".venv-build/",
    ".playwright-mcp/",
    ".pi-lens/",
    ".stitch/",
    "tests/",
    "manual/",
    "out/",
    "explainer-video/",
    "dogfood_artifacts/",
    "dist/",
    "build/",
    "test_comprehensive.py",
    "test_real_video.py",
    "*.mp3",
    "*.mp4",
    "*.mov",
    "*.wav",
    "*.webm",
    "*.egg-info/",
    "node_modules/",
]

[tool.hatch.build.targets.wheel]
packages = ["kinocut", "kinocut_sound"]

[tool.hatch.build.targets.wheel.force-include]
"mcp_video.py" = "mcp_video.py"

[tool.hatch.build.targets.sdist]
# Do not ship /docs/ in the sdist — publish artifact check forbids that path
# (GitHub Release 1.8.0 failed on kinocut-1.8.0.tar.gz including MCPB docs).
# MCPB operator docs remain in-repo and under mcpb/README.md.
only-include = [
    "/kinocut",
    "/kinocut_sound",
    "/mcp_video.py",
    "/CHANGELOG.md",
    "/LICENSE",
    "/mcpb",
    "/README.md",
    "/README-PYPI.md",
    "/pyproject.toml",
    "/scripts/build-mcpb.py",
    "/scripts/mcpb",
    "/server.json",
]

[tool.hatch.build.targets.sdist.force-include]
"mcpb/icon.png" = "mcpb/icon.png"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (real-media integration tests)",
    "hyperframes: marks tests requiring Node.js + Hyperframes CLI",
    "network: marks tests that need live network (not in the default suite)",
    "process_timing: asserts tight process deadlines; run serially by scripts/run_full_suite.py",
]
# pytest-asyncio 1.x warns on every run when this is unset; function scope is
# the behaviour the suite already relies on.
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
# Typed-core rollout: the contract modules every engine depends on are
# type-checked first; expand module by module as annotations are cleaned up.
include = [
    "kinocut/ffmpeg_helpers.py",
    "kinocut/models.py",
    "kinocut/errors.py",
    "kinocut/engine_probe.py",
    "kinocut/engine_runtime_utils.py",
    "kinocut/validation.py",
    "kinocut/validation_errors.py",
    "kinocut/limits.py",
    "kinocut/defaults.py",
    "kinocut/creative",
    "kinocut/remote",
    "kinocut/rescue",
    "kinocut/restorative",
    "kinocut/semantic",
    "kinocut/visual_intelligence",
    "kinocut/cli/formatting.py",
    "kinocut/cli/rescue_formatting.py",
    "kinocut/cli/handlers_postrescue.py",
    "kinocut/cli/handlers_rescue.py",
    "kinocut/cli/parser/postrescue.py",
    "kinocut/cli/parser/rescue.py",
    "kinocut/client/contracts.py",
    "kinocut/client/workflow.py",
    "kinocut/music_grid",
    "kinocut/audio_sync",
    "kinocut/shot_cache",
    "kinocut/subframe_flash.py",
    "kinocut/offline.py",
    "kinocut/openai_compat.py",
    "kinocut/doctor_offline.py",
    "kinocut/tv_preview.py",
    "kinocut/request_log.py",
    "kinocut/postrescue.py",
    "kinocut/server_tools_postrescue.py",
    "kinocut/server_tools_rescue.py",
    # kinocut_sound contract layer: bounded codecs, limits, errors, validation,
    # timeline/sound-plan models and the public request contracts. The engine
    # modules (mix/public/qa workers) still carry type holes and stay out.
    "kinocut_sound/_canonical.py",
    "kinocut_sound/_errors.py",
    "kinocut_sound/_validation_errors.py",
    "kinocut_sound/capability.py",
    "kinocut_sound/captions.py",
    "kinocut_sound/consent.py",
    "kinocut_sound/defaults.py",
    "kinocut_sound/delivery.py",
    "kinocut_sound/format.py",
    "kinocut_sound/limits.py",
    "kinocut_sound/lines.py",
    "kinocut_sound/receipt.py",
    "kinocut_sound/render_fingerprint.py",
    "kinocut_sound/routing.py",
    "kinocut_sound/script_parser.py",
    "kinocut_sound/sound_plan.py",
    "kinocut_sound/timeline.py",
    "kinocut_sound/validation.py",
    "kinocut_sound/_timeline_identity.py",
    "kinocut_sound/mix/_errors.py",
    "kinocut_sound/mix/automated_routing.py",
    "kinocut_sound/mix/automation.py",
    "kinocut_sound/mix/bus_buffers.py",
    "kinocut_sound/mix/crossfade.py",
    "kinocut_sound/mix/ducking.py",
    "kinocut_sound/mix/latency.py",
    "kinocut_sound/mix/placement.py",
    "kinocut_sound/mix/routing_protocol.py",
    "kinocut_sound/mix/seam.py",
    "kinocut_sound/mix/silence.py",
    "kinocut_sound/mix/source_windows.py",
    "kinocut_sound/mix/static_routing.py",
    "kinocut_sound/post/_errors.py",
    "kinocut_sound/public/asr_request.py",
    "kinocut_sound/public/dub_request.py",
    "kinocut_sound/public/loudness_request.py",
    "kinocut_sound/public/master_request.py",
    "kinocut_sound/public/mix_automation_request.py",
    "kinocut_sound/public/mix_layer_receipt.py",
    "kinocut_sound/public/mix_request_v2.py",
    "kinocut_sound/public/mix_request_v3.py",
    "kinocut_sound/public/mix_request_v4.py",
    "kinocut_sound/public/mix_routing_receipt.py",
    "kinocut_sound/public/mix_send_request.py",
    "kinocut_sound/public/mix_sidechain_request.py",
    "kinocut_sound/public/mix_window_receipt.py",
    "kinocut_sound/qa/_errors.py",
    "kinocut_sound/voice/_errors.py",
    "kinocut_sound/voice_consistency/_errors.py",
    "kinocut_sound/world/_errors.py",
]
typeCheckingMode = "basic"
pythonVersion = "3.11"

[tool.coverage.run]
source = ["kinocut", "kinocut_sound"]
omit = ["kinocut/_crush_shader/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
